<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150" role="img" aria-label="Cómo trabajamos: descubrimiento, diseño, desarrollo, despliegue y soporte">
  <title>Cómo trabajamos</title>
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f44ca"/>
      <stop offset="1" stop-color="#3ef75c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f44ca" stop-opacity=".85"/>
      <stop offset=".6" stop-color="#2a2d4a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#3ef75c" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="node0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f44ca"/><stop offset="1" stop-color="#3123c1"/></linearGradient>
    <linearGradient id="node1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b71af"/><stop offset="1" stop-color="#3458a8"/></linearGradient>
    <linearGradient id="node2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#479e93"/><stop offset="1" stop-color="#388d8f"/></linearGradient>
    <linearGradient id="node3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#42ca78"/><stop offset="1" stop-color="#3bc275"/></linearGradient>
    <linearGradient id="node4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ef75c"/><stop offset="1" stop-color="#3ef75c"/></linearGradient>
  </defs>
  <rect width="860" height="150" rx="18" fill="#0F1020"/>
  <rect x=".75" y=".75" width="858.5" height="148.5" rx="17.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <rect x="86" y="46.5" width="688" height="3" rx="1.5" fill="url(#rail)" fill-opacity=".7"/>
  <circle cx="86" cy="48" r="13" fill="#0F1020" stroke="url(#node0)" stroke-width="3"/>
  <circle cx="86" cy="48" r="5" fill="url(#node0)"/>
  <text x="86" y="95" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Descubrimiento</text>
  <text x="86" y="117" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#A9B1C6">Entender el problema</text>
  <circle cx="258" cy="48" r="13" fill="#0F1020" stroke="url(#node1)" stroke-width="3"/>
  <circle cx="258" cy="48" r="5" fill="url(#node1)"/>
  <text x="258" y="95" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Diseño</text>
  <text x="258" y="117" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#A9B1C6">Conceptos primero</text>
  <circle cx="430" cy="48" r="13" fill="#0F1020" stroke="url(#node2)" stroke-width="3"/>
  <circle cx="430" cy="48" r="5" fill="url(#node2)"/>
  <text x="430" y="95" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Desarrollo</text>
  <text x="430" y="117" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#A9B1C6">Fundaciones sólidas</text>
  <circle cx="602" cy="48" r="13" fill="#0F1020" stroke="url(#node3)" stroke-width="3"/>
  <circle cx="602" cy="48" r="5" fill="url(#node3)"/>
  <text x="602" y="95" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Despliegue</text>
  <text x="602" y="117" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#A9B1C6">Producción real</text>
  <circle cx="774" cy="48" r="13" fill="#0F1020" stroke="url(#node4)" stroke-width="3"/>
  <circle cx="774" cy="48" r="5" fill="url(#node4)"/>
  <text x="774" y="95" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Soporte</text>
  <text x="774" y="117" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#A9B1C6">Monitoreo y evolución</text>
</svg>
